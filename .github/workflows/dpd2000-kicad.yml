name: DPD2000 KiCad manufacturing gate

on:
  push:
    branches: [dpd2000-manufacturing]
    paths:
      - 'electronics/**'
      - '.github/workflows/dpd2000-kicad.yml'
  pull_request:
    branches: [main]
    paths:
      - 'electronics/**'
      - '.github/workflows/dpd2000-kicad.yml'
  workflow_dispatch:

jobs:
  kicad-gate:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0.5
    steps:
      - uses: actions/checkout@v4
      - name: KiCad version
        run: kicad-cli version
      - name: Reconstruct and verify byte-exact source bundle
        run: |
          cat electronics/src_chunks/part*.bin > electronics/dpd_kicad_src.rebuilt.tar.gz
          echo '166212301f4671d9662ae3038baa10a2bd0d43c5acd8b3fe1a68ec6717d2652d  electronics/dpd_kicad_src.rebuilt.tar.gz' | sha256sum -c -
          mkdir -p electronics/DPD2000_RevC
          tar -xzf electronics/dpd_kicad_src.rebuilt.tar.gz -C electronics/DPD2000_RevC
          find electronics/DPD2000_RevC -maxdepth 3 -type f -print
      - name: Schematic ERC
        run: |
          mkdir -p electronics/DPD2000_RevC/manufacturing/reports
          set +e
          kicad-cli sch erc --format json --severity-all --exit-code-violations -o electronics/DPD2000_RevC/manufacturing/reports/erc.json electronics/DPD2000_RevC/kicad/DPD2000_RevC.sch
          echo $? > electronics/DPD2000_RevC/manufacturing/reports/erc.exit
          exit 0
      - name: PCB DRC and schematic parity
        run: |
          set +e
          kicad-cli pcb drc --format json --severity-all --exit-code-violations --all-track-errors --refill-zones --schematic-parity -o electronics/DPD2000_RevC/manufacturing/reports/drc.json electronics/DPD2000_RevC/kicad/DPD2000_RevC.kicad_pcb
          echo $? > electronics/DPD2000_RevC/manufacturing/reports/drc.exit
          exit 0
      - name: Enforce ERC and DRC gates
        run: |
          echo "ERC exit: $(cat electronics/DPD2000_RevC/manufacturing/reports/erc.exit)"
          echo "DRC exit: $(cat electronics/DPD2000_RevC/manufacturing/reports/drc.exit)"
          test "$(cat electronics/DPD2000_RevC/manufacturing/reports/erc.exit)" = "0"
          test "$(cat electronics/DPD2000_RevC/manufacturing/reports/drc.exit)" = "0"
      - name: Export fabrication package
        run: |
          mkdir -p electronics/DPD2000_RevC/manufacturing/gerbers
          kicad-cli pcb export gerbers -o electronics/DPD2000_RevC/manufacturing/gerbers/ electronics/DPD2000_RevC/kicad/DPD2000_RevC.kicad_pcb
          kicad-cli pcb export drill -o electronics/DPD2000_RevC/manufacturing/gerbers/ electronics/DPD2000_RevC/kicad/DPD2000_RevC.kicad_pcb
          kicad-cli pcb export pos --format csv --units mm --side both -o electronics/DPD2000_RevC/manufacturing/DPD2000_positions.csv electronics/DPD2000_RevC/kicad/DPD2000_RevC.kicad_pcb
          kicad-cli sch export pdf -o electronics/DPD2000_RevC/manufacturing/DPD2000_schematic.pdf electronics/DPD2000_RevC/kicad/DPD2000_RevC.sch
      - name: Package
        run: |
          cd electronics/DPD2000_RevC
          tar -czf DPD2000_RevC_KiCad10_manufacturing.tar.gz kicad manufacturing
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DPD2000-RevC-kicad-gate
          path: |
            electronics/DPD2000_RevC/manufacturing
            electronics/DPD2000_RevC/kicad
            electronics/DPD2000_RevC/DPD2000_RevC_KiCad10_manufacturing.tar.gz
          if-no-files-found: warn

  ngspice-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and verify byte-exact source bundle
        run: |
          cat electronics/src_chunks/part*.bin > electronics/dpd_kicad_src.rebuilt.tar.gz
          echo '166212301f4671d9662ae3038baa10a2bd0d43c5acd8b3fe1a68ec6717d2652d  electronics/dpd_kicad_src.rebuilt.tar.gz' | sha256sum -c -
          mkdir -p electronics/DPD2000_RevC
          tar -xzf electronics/dpd_kicad_src.rebuilt.tar.gz -C electronics/DPD2000_RevC
      - name: Install real ngspice
        run: |
          sudo apt-get update
          sudo apt-get install -y ngspice
          ngspice --version
      - name: Run SPICE decks
        run: |
          mkdir -p electronics/DPD2000_RevC/manufacturing/spice
          for d in hv_pt_cw.cir afe_tot.cir pt_input_resonance.cir; do
            ngspice -b -o "electronics/DPD2000_RevC/manufacturing/spice/${d%.cir}.log" "electronics/DPD2000_RevC/sim/$d"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DPD2000-RevC-ngspice-proof
          path: electronics/DPD2000_RevC/manufacturing/spice
          if-no-files-found: warn

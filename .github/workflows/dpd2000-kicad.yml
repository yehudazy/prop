name: DPD2000 KiCad manufacturing gate

on:
  push:
    branches: [dpd2000-manufacturing]
    paths:
      - 'electronics/**'
      - '.github/workflows/dpd2000-kicad.yml'
  pull_request:
    branches: [main]
    paths:
      - 'electronics/**'
      - '.github/workflows/dpd2000-kicad.yml'
  workflow_dispatch:

jobs:
  kicad-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and verify byte-exact source bundle
        run: |
          cat electronics/src_chunks/part000.bin electronics/src_chunks/part001a.bin electronics/src_chunks/part001b.bin electronics/src_chunks/part002.bin electronics/src_chunks/part003.bin electronics/src_chunks/part004.bin electronics/src_chunks/part005.bin > electronics/dpd_kicad_src.rebuilt.tar.gz
          echo '166212301f4671d9662ae3038baa10a2bd0d43c5acd8b3fe1a68ec6717d2652d  electronics/dpd_kicad_src.rebuilt.tar.gz' | sha256sum -c -
          rm -rf electronics/DPD2000_RevC
          mkdir -p electronics/DPD2000_RevC
          tar -xzf electronics/dpd_kicad_src.rebuilt.tar.gz -C electronics/DPD2000_RevC
          cp electronics/overrides/hv_pt_cw.cir electronics/DPD2000_RevC/sim/hv_pt_cw.cir
          cp electronics/overrides/afe_tot.cir electronics/DPD2000_RevC/sim/afe_tot.cir
          find electronics/DPD2000_RevC -maxdepth 3 -type f -print

      - name: Pull real KiCad CLI image
        run: docker pull kicad/kicad:10.0.5

      - name: KiCad version
        run: |
          docker run --rm --entrypoint kicad-cli kicad/kicad:10.0.5 version

      - name: Schematic ERC
        run: |
          mkdir -p electronics/DPD2000_RevC/manufacturing/reports
          set +e
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            --entrypoint kicad-cli kicad/kicad:10.0.5 \
            sch erc --format json --severity-all --exit-code-violations \
            -o electronics/DPD2000_RevC/manufacturing/reports/erc.json \
            electronics/DPD2000_RevC/kicad/DPD2000_RevC.sch
          echo $? > electronics/DPD2000_RevC/manufacturing/reports/erc.exit
          exit 0

      - name: PCB DRC and schematic parity
        run: |
          set +e
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            --entrypoint kicad-cli kicad/kicad:10.0.5 \
            pcb drc --format json --severity-all --exit-code-violations \
            --all-track-errors --refill-zones --schematic-parity \
            -o electronics/DPD2000_RevC/manufacturing/reports/drc.json \
            electronics/DPD2000_RevC/kicad/DPD2000_RevC.kicad_pcb
          echo $? > electronics/DPD2000_RevC/manufacturing/reports/drc.exit
          exit 0

      - name: Export diagnostic schematic PDF
        if: always()
        run: |
          mkdir -p electronics/DPD2000_RevC/manufacturing
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            --entrypoint kicad-cli kicad/kicad:10.0.5 \
            sch export pdf \
            -o electronics/DPD2000_RevC/manufacturing/DPD2000_schematic.pdf \
            electronics/DPD2000_RevC/kicad/DPD2000_RevC.sch || true

      - name: Enforce ERC and DRC gates
        run: |
          echo "ERC exit: $(cat electronics/DPD2000_RevC/manufacturing/reports/erc.exit)"
          echo "DRC exit: $(cat electronics/DPD2000_RevC/manufacturing/reports/drc.exit)"
          test "$(cat electronics/DPD2000_RevC/manufacturing/reports/erc.exit)" = "0"
          test "$(cat electronics/DPD2000_RevC/manufacturing/reports/drc.exit)" = "0"

      - name: Export fabrication package
        run: |
          mkdir -p electronics/DPD2000_RevC/manufacturing/gerbers
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work --entrypoint kicad-cli kicad/kicad:10.0.5 \
            pcb export gerbers -o electronics/DPD2000_RevC/manufacturing/gerbers/ electronics/DPD2000_RevC/kicad/DPD2000_RevC.kicad_pcb
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work --entrypoint kicad-cli kicad/kicad:10.0.5 \
            pcb export drill -o electronics/DPD2000_RevC/manufacturing/gerbers/ electronics/DPD2000_RevC/kicad/DPD2000_RevC.kicad_pcb
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work --entrypoint kicad-cli kicad/kicad:10.0.5 \
            pcb export pos --format csv --units mm --side both \
            -o electronics/DPD2000_RevC/manufacturing/DPD2000_positions.csv \
            electronics/DPD2000_RevC/kicad/DPD2000_RevC.kicad_pcb

      - name: Package
        run: |
          cd electronics/DPD2000_RevC
          tar -czf DPD2000_RevC_KiCad10_manufacturing.tar.gz kicad manufacturing

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DPD2000-RevC-kicad-gate
          path: |
            electronics/DPD2000_RevC/manufacturing
            electronics/DPD2000_RevC/kicad
            electronics/DPD2000_RevC/DPD2000_RevC_KiCad10_manufacturing.tar.gz
          if-no-files-found: warn

  ngspice-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and verify byte-exact source bundle
        run: |
          cat electronics/src_chunks/part000.bin electronics/src_chunks/part001a.bin electronics/src_chunks/part001b.bin electronics/src_chunks/part002.bin electronics/src_chunks/part003.bin electronics/src_chunks/part004.bin electronics/src_chunks/part005.bin > electronics/dpd_kicad_src.rebuilt.tar.gz
          echo '166212301f4671d9662ae3038baa10a2bd0d43c5acd8b3fe1a68ec6717d2652d  electronics/dpd_kicad_src.rebuilt.tar.gz' | sha256sum -c -
          rm -rf electronics/DPD2000_RevC
          mkdir -p electronics/DPD2000_RevC
          tar -xzf electronics/dpd_kicad_src.rebuilt.tar.gz -C electronics/DPD2000_RevC
          cp electronics/overrides/hv_pt_cw.cir electronics/DPD2000_RevC/sim/hv_pt_cw.cir
          cp electronics/overrides/afe_tot.cir electronics/DPD2000_RevC/sim/afe_tot.cir

      - name: Install real ngspice
        run: |
          sudo apt-get update
          sudo apt-get install -y ngspice
          ngspice --version

      - name: Run all SPICE decks
        run: |
          mkdir -p electronics/DPD2000_RevC/manufacturing/spice
          fail=0
          for d in hv_pt_cw.cir afe_tot.cir pt_input_resonance.cir; do
            echo "=== $d ==="
            ngspice -b \
              -o "electronics/DPD2000_RevC/manufacturing/spice/${d%.cir}.log" \
              "electronics/DPD2000_RevC/sim/$d" || fail=1
          done
          exit $fail

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DPD2000-RevC-ngspice-proof
          path: electronics/DPD2000_RevC/manufacturing/spice
          if-no-files-found: warn
